<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{app_name}}">
<meta name="theme-color" content="#11131a">
<meta name="color-scheme" content="dark light">
<title>{{app_name}}</title>
<link rel="icon" type="image/png" href="__ICON__">
<style>__STYLES__</style>
</head>
<body>
<div class="wrap">

<header>
  <h1><img class="logo" src="__ICON__" alt="">{{brand_lead}} <span>{{brand_tail}}</span></h1>
  <p id="meta">{{meta_loading}}</p>
</header>

<details class="card" id="panel" open>
  <summary>
    <span>{{panel_search}}</span>
    <span class="rack" id="headRack"></span>
    <span class="chev">&#9662;</span>
  </summary>
  <div class="panelbody">
  <label class="lbl" for="letters">{{label_letters}}</label>
  <div class="entry">
    <input id="letters" type="text" placeholder="{{ph_letters}}"
           autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
    <button class="key" id="addWild" type="button" title="{{title_wildcard}}">?</button>
    <button class="key" id="clear" type="button" title="{{title_clear}}">&times;</button>
  </div>
  <span class="hint">{{hint_letters}}</span>

  <details id="opts" open>
    <summary>{{panel_options}}</summary>
    <div class="grid">
      <div class="ctl" id="lenWrap">
        <label class="lbl" for="length">{{label_lengths}}</label>
        <input id="length" type="text" inputmode="numeric" placeholder="{{ph_lengths}}" autocomplete="off">
        <span class="hint">{{hint_lengths}}</span>
      </div>
      <div class="ctl" id="minWrap">
        <label class="lbl" for="min">{{label_min}}</label>
        <input id="min" type="number" inputmode="numeric" min="1" max="12" value="4">
      </div>
      <div class="ctl" id="maxWrap">
        <label class="lbl" for="max">{{label_max}}</label>
        <input id="max" type="number" inputmode="numeric" min="1" max="12" placeholder="{{ph_max}}">
      </div>
      <div class="ctl">
        <label class="lbl" for="pattern">{{label_pattern}}</label>
        <input id="pattern" type="text" placeholder="{{ph_pattern}}"
               autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
        <span class="hint">{{hint_pattern}}</span>
      </div>
      <div class="ctl">
        <label class="lbl" for="exclude">{{label_exclude}}</label>
        <input id="exclude" type="text" placeholder="{{ph_exclude}}"
               autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
        <span class="hint">{{hint_exclude}}</span>
      </div>
      <div class="ctl">
        <label class="lbl" for="limit">{{label_limit}}</label>
        <input id="limit" type="number" inputmode="numeric" min="0" placeholder="{{ph_limit}}">
      </div>
    </div>

    <div class="row">
      <label class="toggle">
        <input type="checkbox" id="exact">
        <span>{{toggle_exact}} <em>{{toggle_exact_note}}</em></span>
      </label>
    </div>
  </details>

  <div class="row">
    <div class="seg" role="group" aria-label="View">
      <button type="button" class="on" data-view="grouped">{{view_grouped}}</button>
      <button type="button" data-view="flat">{{view_flat}}</button>
      <button type="button" data-view="count">{{view_counts}}</button>
    </div>
  </div>
  </div>
</details>

<p id="status" aria-live="polite"></p>
<p class="copyhint" id="copyHint" hidden>{{hint_click_copy}}</p>
<div id="results"></div>

</div>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="true"></div>

<script id="wl" type="text/plain">__WORDLIST__</script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const MAX_SHOW = 3000;

let WORDS = null, MASK = null, LEN = null, LONGEST = 0;
let view = "grouped", lastWords = [], timer = null;
/* Lengths the reader has collapsed. Results re-render on every keystroke,
   so without this a closed group would spring open again as you type. */
const collapsed = new Set();

/* ---- dictionary: decode the front-coded list ------------------------- */
/* Each line is <shared-prefix-length as one char><the rest of the word>. */
function decode() {
  const raw = $("wl").textContent;
  const lines = raw.split("\n");
  const n = lines.length;
  const words = new Array(n);
  const mask = new Int32Array(n);
  const len = new Uint8Array(n);
  let prev = "", longest = 0;
  for (let i = 0; i < n; i++) {
    const line = lines[i];
    prev = prev.slice(0, line.charCodeAt(0) - 48) + line.slice(1);
    words[i] = prev;
    let m = 0;
    for (let j = 0; j < prev.length; j++) m |= 1 << (prev.charCodeAt(j) - 97);
    mask[i] = m;
    len[i] = prev.length;
    if (prev.length > longest) longest = prev.length;
  }
  WORDS = words; MASK = mask; LEN = len; LONGEST = longest;
}

function popcount(n) {
  n = n - ((n >> 1) & 0x55555555);
  n = (n & 0x33333333) + ((n >> 2) & 0x33333333);
  return (((n + (n >> 4)) & 0x0f0f0f0f) * 0x01010101) >> 24;
}

/* ---- the solver: same rules as main.py ------------------------------- */
function parseRack(raw) {
  const rack = new Int32Array(26);
  let wild = 0;
  for (const ch of raw.toLowerCase()) {
    if (ch === "?") wild++;
    else if (ch >= "a" && ch <= "z") rack[ch.charCodeAt(0) - 97]++;
    else if (" ,.-_".includes(ch)) continue;
    else throw new Error("Invalid character in letters: '" + ch + "' (use a-z and ?)");
  }
  return { rack, wild };
}

function solve(rack, wild, wanted) {
  let rackMask = 0;
  for (let i = 0; i < 26; i++) if (rack[i]) rackMask |= 1 << i;
  const unavailable = ~rackMask;
  const seen = new Int32Array(26);
  const found = new Map();

  for (let i = 0; i < WORDS.length; i++) {
    const L = LEN[i];
    if (!wanted.has(L)) continue;
    if (popcount(MASK[i] & unavailable) > wild) continue;

    const w = WORDS[i];
    let deficit = 0;
    for (let j = 0; j < L; j++) {
      const c = w.charCodeAt(j) - 97;
      if (++seen[c] > rack[c]) deficit++;
    }
    for (let j = 0; j < L; j++) seen[w.charCodeAt(j) - 97] = 0;
    if (deficit > wild) continue;

    let bucket = found.get(L);
    if (!bucket) found.set(L, bucket = []);
    bucket.push(w);
  }
  return found;
}

/* Which lengths to search; mirrors choose_lengths() in main.py. */
function chooseLengths(opts, tiles) {
  const notes = [];
  if (opts.exact) {
    if (tiles > LONGEST) return { set: new Set(), notes: ["no word is " + tiles + " letters long"] };
    return { set: new Set([tiles]), notes };
  }
  if (opts.length) {
    const parts = opts.length.replace(/\s+/g, ",").split(",").filter(Boolean);
    const wanted = [];
    for (const p of parts) {
      if (!/^\d+$/.test(p)) throw new Error("Invalid length value: '" + opts.length + "' (expected e.g. 4,5,7)");
      wanted.push(parseInt(p, 10));
    }
    const over = wanted.filter((n) => n > tiles);
    if (over.length) notes.push(over.join(", ") + " exceeds the " + tiles + " tiles available");
    return { set: new Set(wanted.filter((n) => n >= 1 && n <= tiles)), notes };
  }
  const upper = Math.min(opts.max || tiles, tiles, LONGEST);
  const set = new Set();
  for (let n = Math.max(opts.min, 1); n <= upper; n++) set.add(n);
  return { set, notes };
}

/* ---- UI --------------------------------------------------------------- */
function flash(msg, bad) {
  $("status").textContent = msg;
  $("status").classList.toggle("err", !!bad);
}

/* Mirror the letters into the panel header, so a collapsed panel still shows
   what is being solved. */
function syncHead() {
  const v = $("letters").value;
  $("headRack").textContent = v ? [...v].join(" ") : "no letters yet";
}

function reflectDisabled() {
  const exact = $("exact").checked;
  const byLength = $("length").value.trim() !== "";
  $("lenWrap").classList.toggle("off", exact);
  $("minWrap").classList.toggle("off", exact || byLength);
  $("maxWrap").classList.toggle("off", exact || byLength);
}

function run() {
  const raw = $("letters").value.trim();
  const results = $("results");
  $("copyHint").hidden = true;
  lastWords = [];
  if (!WORDS) return;
  if (!raw) {
    results.innerHTML = '<p class="empty">Type the board letters to begin.</p>';
    flash("");
    return;
  }

  let rack, wild, lengths;
  try {
    ({ rack, wild } = parseRack(raw));
    const tiles = rack.reduce((a, b) => a + b, 0) + wild;
    if (!tiles) throw new Error("No letters given.");
    lengths = chooseLengths({
      exact: $("exact").checked,
      length: $("length").value.trim(),
      min: parseInt($("min").value, 10) || 4,
      max: parseInt($("max").value, 10) || 0,
    }, tiles);
    var tileCount = tiles;
  } catch (e) {
    results.innerHTML = "";
    flash(e.message, true);
    return;
  }

  const t0 = performance.now();
  const found = solve(rack, wild, lengths.set);
  const ms = Math.round(performance.now() - t0);

  const pat = $("pattern").value.trim();
  if (pat) {
    let re;
    try {
      re = new RegExp("^" + pat.toLowerCase().replace(/[?.]/g, ".") + "$");
    } catch {
      flash("Invalid pattern.", true);
      return;
    }
    for (const [L, words] of [...found]) {
      const kept = words.filter((w) => re.test(w));
      if (kept.length) found.set(L, kept); else found.delete(L);
    }
  }

  /* By letter, not by count: a board letter that is not really in play makes
     any word using it wrong, however many of it the rack seems to hold. */
  const banned = new Set($("exclude").value.toLowerCase().replace(/[^a-z]/g, ""));
  if (banned.size) {
    for (const [L, words] of [...found]) {
      const kept = words.filter((w) => ![...w].some((c) => banned.has(c)));
      if (kept.length) found.set(L, kept); else found.delete(L);
    }
  }

  const limit = parseInt($("limit").value, 10) || 0;
  let total = 0;
  for (const words of found.values()) total += words.length;

  const groups = [];
  let shown = 0, capped = false;
  for (const L of [...found.keys()].sort((a, b) => b - a)) {
    const words = found.get(L);
    let take = limit > 0 ? words.slice(0, limit) : words;
    if (shown + take.length > MAX_SHOW) { take = take.slice(0, MAX_SHOW - shown); capped = true; }
    shown += take.length;
    groups.push({ length: L, count: words.length, words: take });
    if (capped) break;
  }

  const letters = tileCount - wild;
  let summary = total.toLocaleString() + " word" + (total === 1 ? "" : "s") +
    " from " + letters + " letter" + (letters === 1 ? "" : "s");
  if (wild) summary += " + " + wild + " wildcard" + (wild === 1 ? "" : "s");
  summary += " · " + ms + " ms";
  for (const n of lengths.notes) summary += " · " + n;
  if (banned.size) summary += " · excluding " + [...banned].sort().join(", ");
  if (capped) summary += " · showing first " + MAX_SHOW.toLocaleString();
  flash(summary);

  render(groups, total);
}

function chip(w) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "word";
  b.textContent = w;
  return b;
}

/* ---- copying a single word -------------------------------------------- */
/* Both from ui.py, so the CSS transition and this timer stay in step. */
/* Quoted so this file is valid JS before rendering as well as after. */
const TOAST_MS = +"{{toast_ms}}", TOAST_FADE_MS = +"{{toast_fade_ms}}";

async function copyWord(word) {
  try {
    await navigator.clipboard.writeText(word);
  } catch {
    const ta = document.createElement("textarea");   // iOS fallback
    ta.value = word; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.append(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
    if (!ok) { flash("{{msg_copy_failed}}", true); return; }
  }
  toast(word);
}

/* Android-style: a new toast wipes out whatever is on screen at once, rather
   than queueing behind it or crossfading with it. */
function toast(word) {
  const host = $("toasts");
  for (const old of host.querySelectorAll(".toast")) {
    clearTimeout(old.dismiss);
    old.remove();
  }

  const el = document.createElement("div");
  el.className = "toast";
  const c = document.createElement("code");
  c.textContent = word;
  el.append(c, document.createTextNode("{{toast_copied_suffix}}"));
  host.append(el);

  /* Two frames, so the browser paints the off-screen state before animating. */
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));

  el.dismiss = setTimeout(() => {
    el.classList.remove("show");
    el.dismiss = setTimeout(() => el.remove(), TOAST_FADE_MS + 80);
  }, TOAST_MS);
}

function render(groups, total) {
  const results = $("results");
  $("copyHint").hidden = true;
  lastWords = groups.flatMap((g) => g.words);
  if (!total) { results.innerHTML = '<p class="empty">{{msg_no_match}}</p>'; return; }

  if (view === "count") {
    results.innerHTML = "<table class='counts'>" +
      groups.map((g) => "<tr><td>" + g.length + " letters</td><td>" + g.count.toLocaleString() + "</td></tr>").join("") +
      "<tr><td>total</td><td>" + total.toLocaleString() + "</td></tr></table>";
    return;
  }

  $("copyHint").hidden = false;   // past the empty and Counts cases: chips follow
  const frag = document.createDocumentFragment();
  if (view === "flat") {
    const box = document.createElement("div");
    box.className = "words flat";
    box.append(...lastWords.map(chip));
    frag.append(box);
  } else {
    for (const g of groups) {
      const sec = document.createElement("details");
      sec.className = "group";
      sec.open = !collapsed.has(g.length);
      sec.addEventListener("toggle", () => {
        if (sec.open) collapsed.delete(g.length);
        else collapsed.add(g.length);
      });
      const h = document.createElement("summary");
      h.innerHTML = "<b>" + g.length + " letters</b> <i>" + g.count.toLocaleString() +
        (g.words.length < g.count ? ", showing " + g.words.length : "") + "</i>" +
        '<span class="rule"></span><span class="chev">&#9662;</span>';
      const box = document.createElement("div");
      box.className = "words";
      box.append(...g.words.map(chip));
      sec.append(h, box);
      frag.append(sec);
    }
  }
  results.replaceChildren(frag);
}

function schedule() { clearTimeout(timer); timer = setTimeout(run, 160); }

/* ---- wiring ----------------------------------------------------------- */
$("letters").addEventListener("input", (e) => {
  const el = e.target, pos = el.selectionStart, before = el.value;
  const clean = before.toLowerCase().replace(/[^a-z?]/g, "");
  if (clean !== before) {
    el.value = clean;
    const back = before.length - clean.length;
    el.setSelectionRange(pos - back, pos - back);
  }
  syncHead();
  schedule();
});

$("addWild").addEventListener("click", () => {
  const el = $("letters");
  const at = el.selectionStart ?? el.value.length;
  el.value = el.value.slice(0, at) + "?" + el.value.slice(el.selectionEnd ?? at);
  el.setSelectionRange(at + 1, at + 1);
  el.focus();
  syncHead();
  run();
});

$("clear").addEventListener("click", () => {
  $("letters").value = "";
  $("letters").focus();
  syncHead();
  run();
});

$("pattern").addEventListener("input", (e) => {
  e.target.value = e.target.value.toLowerCase().replace(/[^a-z.?]/g, "");
});

$("exclude").addEventListener("input", (e) => {
  e.target.value = e.target.value.toLowerCase().replace(/[^a-z]/g, "");
});

for (const id of ["length", "min", "max", "pattern", "exclude", "limit", "exact"]) {
  $(id).addEventListener("input", () => { reflectDisabled(); schedule(); });
}

document.querySelectorAll(".seg button").forEach((b) => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".seg button").forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    view = b.dataset.view;
    run();
  });
});

/* One listener for the whole board: there can be thousands of chips. */
$("results").addEventListener("click", (e) => {
  const el = e.target.closest(".word");
  if (el) copyWord(el.textContent);
});

/* Decode after first paint so the page is visible straight away. */
$("results").innerHTML = '<p class="empty">{{msg_loading_dict}}</p>';
/* Options panel starts open on desktop, collapsed under the "md" width (768px). */
if (window.matchMedia("(max-width: 767px)").matches) $("opts").open = false;
reflectDisabled();
syncHead();
setTimeout(() => {
  const t0 = performance.now();
  decode();
  $("meta").textContent = WORDS.length.toLocaleString() + " words · ready in " +
    Math.round(performance.now() - t0) + " ms";
  $("results").innerHTML = '<p class="empty">{{msg_prompt}}</p>';
  if ($("letters").value) run();
}, 0);
</script>
</body>
</html>
