<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{app_name}}</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="bar">
  <h1><img class="logo" src="/icon.png" alt="">{{brand_lead}} {{brand_tail}}</h1>
  <p class="dict" id="dictInfo"><span>{{dict_info_source}}</span> <span>{{dict_info_wildcards}}</span></p>
</header>

<main>
  <form id="form" autocomplete="off">

    <details class="card" id="panel" open>
      <summary>
        <span>{{panel_search}}</span>
        <span class="rack" id="headRack"></span>
        <span class="chev">&#9662;</span>
      </summary>

      <div class="panelbody">

        <label class="letters-field">
          <span class="label">{{label_letters}}</span>
          <input id="letters" name="letters" type="text" inputmode="latin"
                 placeholder="{{ph_letters}}" spellcheck="false" autofocus>
          <span class="hint">{{hint_letters}}</span>
        </label>

        <details id="opts" open>
          <summary>{{panel_options}}</summary>

          <div class="controls">

            <label class="ctl">
              <span class="label">{{label_exclude}}</span>
              <input id="exclude" type="text" placeholder="{{ph_exclude}}" spellcheck="false">
              <span class="hint">{{hint_exclude}}</span>
            </label>

            <label class="ctl">
              <span class="label">{{label_lengths}}</span>
              <input id="length" type="text" placeholder="{{ph_lengths}}" spellcheck="false">
              <span class="hint">{{hint_lengths}}</span>
            </label>

            <label class="ctl" id="minWrap">
              <span class="label">{{label_min}}</span>
              <input id="min" type="number" min="1" max="12" value="4">
              <span class="hint">{{hint_min}}</span>
            </label>

            <label class="ctl" id="maxWrap">
              <span class="label">{{label_max}}</span>
              <input id="max" type="number" min="1" max="12" placeholder="{{ph_max}}">
              <span class="hint">{{hint_max}}</span>
            </label>

            <label class="ctl">
              <span class="label">{{label_limit}}</span>
              <input id="limit" type="number" min="0" placeholder="{{ph_limit}}">
              <span class="hint">{{hint_limit}}</span>
            </label>

          </div>

          <details class="subopts" id="patternOpts">
            <summary>{{label_pattern}}</summary>
            <div class="controls">
              <div class="ctl">
                <input id="pattern" type="text" placeholder="{{ph_pattern}}"
                       aria-label="{{label_pattern}}" spellcheck="false">
                <span class="hint">{{hint_pattern}}</span>
              </div>
            </div>
          </details>

          <div class="optsrow">
            <label class="toggle">
              <input type="checkbox" id="exact">
              <span>{{toggle_exact}} <em>{{toggle_exact_note}}</em></span>
            </label>
          </div>
        </details>

        <div class="switches">
          <div class="seg" role="group" aria-label="View">
            <button type="button" class="on" data-view="grouped">{{view_grouped}}</button>
            <button type="button" data-view="flat">{{view_flat}}</button>
            <button type="button" data-view="count">{{view_counts}}</button>
          </div>

          <div class="spacer"></div>
          <button type="submit" id="go">{{btn_solve}}</button>
        </div>

      </div>
    </details>
  </form>

  <section id="status" class="status" aria-live="polite"></section>
  <p class="dict copyhint" id="copyHint" hidden>{{hint_click_copy}}</p>
  <section id="results" class="results"></section>
</main>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="true"></div>

<script src="/app.js"></script>
</body>
</html>
