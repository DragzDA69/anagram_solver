<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{app_name}}</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <h1><img class="logo" src="/icon.png" alt="">{{brand_lead}} {{brand_tail}}</h1>
    <span class="developer-credit">{{developer_credit}}</span>
  </div>
  <p class="dict app-description" id="dictInfo"><span>{{dict_info_source}}</span> <span>{{dict_info_wildcards}}</span></p>
</header>

<main>
  <form id="form" autocomplete="off">

    <details class="card" id="panel" open>
      <summary>
        <span>{{panel_search}}</span>
        <span class="rack" id="headRack"></span>
        <span class="chev">&#8595;</span>
      </summary>

      <div class="panelbody">

        <div class="letters-field">
          <label class="label" for="letters">{{label_letters}}</label>
          <div class="field">
            <input id="letters" name="letters" type="text" inputmode="latin"
                   placeholder="{{ph_letters}}" spellcheck="false" autofocus>
            <button type="button" id="wildcard" class="clearbtn"
                    title="{{title_wildcard}}" aria-label="{{title_wildcard}}">?</button>
            <button type="button" id="clear" class="clearbtn"
                    title="{{title_clear}}" aria-label="{{title_clear}}" hidden><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg></button>
          </div>
          <span class="hint">{{hint_letters}}</span>
        </div>

        <details id="opts" open>
          <summary>{{panel_options}}</summary>

          <div class="controls">

            <label class="ctl">
              <span class="label">{{label_exclude}}</span>
              <div class="field">
                <input id="exclude" type="text" placeholder="{{ph_exclude}}" spellcheck="false">
                <button type="button" class="clearbtn small" id="clear-exclude"
                        title="{{title_clear}}" aria-label="{{title_clear}}" hidden>
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
                </button>
              </div>
              <span class="hint">{{hint_exclude}}</span>
            </label>

            <label class="ctl">
              <span class="label">{{label_lengths}}</span>
              <div class="field">
                <input id="length" type="text" placeholder="{{ph_lengths}}" spellcheck="false">
                <button type="button" class="clearbtn small" id="clear-length"
                        title="{{title_clear}}" aria-label="{{title_clear}}" hidden>
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
                </button>
              </div>
              <span class="hint">{{hint_lengths}}</span>
            </label>

            <label class="ctl" id="minWrap">
              <span class="label">{{label_min}}</span>
              <div class="field">
                <input id="min" type="number" min="1" max="50" value="4">
                <button type="button" class="clearbtn small" id="clear-min"
                        title="{{title_clear}}" aria-label="{{title_clear}}" hidden>
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
                </button>
              </div>
              <span class="hint">{{hint_min}}</span>
            </label>

            <label class="ctl" id="maxWrap">
              <span class="label">{{label_max}}</span>
              <div class="field">
                <input id="max" type="number" min="1" max="50" value="15" placeholder="{{ph_max}}">
                <button type="button" class="clearbtn small" id="clear-max"
                        title="{{title_clear}}" aria-label="{{title_clear}}" hidden>
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
                </button>
              </div>
              <span class="hint">{{hint_max}}</span>
            </label>

            <label class="ctl">
              <span class="label">{{label_limit}}</span>
              <div class="field">
                <input id="limit" type="number" min="0" placeholder="{{ph_limit}}">
                <button type="button" class="clearbtn small" id="clear-limit"
                        title="{{title_clear}}" aria-label="{{title_clear}}" hidden>
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
                </button>
              </div>
              <span class="hint">{{hint_limit}}</span>
            </label>

          </div>

          <details class="subopts" id="patternOpts">
            <summary>{{label_pattern}}</summary>
            <div class="controls">
              <div class="ctl">
                <div class="field">
                  <input id="pattern" type="text" placeholder="{{ph_pattern}}"
                         aria-label="{{label_pattern}}" spellcheck="false">
                  <button type="button" class="clearbtn small" id="clear-pattern"
                          title="{{title_clear}}" aria-label="{{title_clear}}" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
                  </button>
                </div>
                <span class="hint">{{hint_pattern}}</span>
              </div>
            </div>
          </details>

          <div class="optsrow">
            <label class="toggle">
              <input type="checkbox" id="exact">
              <span>{{toggle_exact}} 
                <em>{{toggle_exact_note}}</em>
              </span>
            </label>
          </div>
        </details>

        <div class="switches">
          <div class="seg" role="group" aria-label="View">
            <button type="button" class="on" data-view="grouped">{{view_grouped}}</button>
            <button type="button" data-view="flat">{{view_flat}}</button>
            <button type="button" data-view="count">{{view_counts}}</button>
          </div>

          <div class="spacer"></div>
          <div class="form-actions">
            <button type="button" class="secondary-btn" id="clearForm" disabled>{{btn_clear_form}}</button>
            <button type="submit" id="go">{{btn_solve}}</button>
          </div>
        </div>

      </div>
    </details>
  </form>

  <section id="status" class="status" aria-live="polite"></section>
  <div class="copyrow" id="copyRow" hidden>
    <p class="dict copyhint" id="copyHint">{{hint_click_copy}}</p>
    <button type="button" class="linkbtn" id="toggleAll" hidden>{{btn_collapse_all}}</button>
  </div>
  <section id="results" class="results"></section>
</main>

<dialog id="clearDialog" class="confirm-dialog" aria-labelledby="clearDialogTitle"
        aria-describedby="clearDialogMessage">
  <form method="dialog">
    <h2 id="clearDialogTitle">{{clear_dialog_title}}</h2>
    <p id="clearDialogMessage">{{clear_dialog_message}}</p>
    <div class="dialog-actions">
      <button type="submit" class="secondary-btn" value="cancel" autofocus>{{btn_cancel}}</button>
      <button type="submit" value="clear">{{btn_confirm_clear}}</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="true"></div>

<script src="/app.js"></script>
</body>
</html>
